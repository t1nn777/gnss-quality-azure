name: infra

on:
  pull_request:
    paths: ["infra/app/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/app/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC token -> Azure (no client secret)
  contents: read

# Never two plans/applies against the same state at once.
concurrency:
  group: terraform-infra-app
  cancel-in-progress: false

env:
  # azurerm provider + azurerm backend both read these; OIDC, no secrets.
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_github_owner: ${{ github.repository_owner }}
  TF_VAR_github_repo: ${{ github.event.repository.name }}
  TF_VAR_tfstate_storage_account_id: /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.TFSTATE_RESOURCE_GROUP }}/providers/Microsoft.Storage/storageAccounts/${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: infra/app

jobs:
  terraform:
    # Skipped until the state backend is configured (repository variable set after Phase 4).
    if: vars.TFSTATE_STORAGE_ACCOUNT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: >
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=tfstate"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      - name: terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -lock-timeout=5m tfplan
